services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    volumes:
      - library_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./systems/backend
    environment:
      DATABASE_URL: postgresql+psycopg://library:library@db:5432/library
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./systems/frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "8080:80"

  workbench-api:
    build:
      context: ./workbench_api
    environment:
      AGENT_RUNTIME_PROVIDER: bridge
      AGENT_BRIDGE_URL: http://host.docker.internal:8020
      AGENT_WORKSPACE_ROOT: /workspace
      WORKBENCH_DATA_DIR: /data
    volumes:
      - workbench_data:/data
      - .:/workspace:ro
    ports:
      - "8010:8010"

  workbench-ui:
    build:
      context: ./workbench_ui
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - workbench-api
    ports:
      - "8090:80"

volumes:
  library_db:
  workbench_data:
